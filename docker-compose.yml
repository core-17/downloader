services:
  # --- 1. База даних (PostgreSQL 16) ---
  postgres:
    image: postgres:16-alpine
    container_name: downloader_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-downloader}
      POSTGRES_USER: ${POSTGRES_USER:-downloader_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_downloader_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-downloader_user} -d ${POSTGRES_DB:-downloader}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. Брокер черги задач (Redis 7) ---
  redis:
    image: redis:7-alpine
    container_name: downloader_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 3. S3-сумісне сховище (SeaweedFS, Apache-2.0) ---
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: downloader_s3
    restart: unless-stopped
    ports:
      - "8333:8333" # S3 API endpoint
      - "9333:9333" # Master HTTP
    command: "server -s3 -dir=/data -s3.port=8333"
    volumes:
      - seaweedfs_data:/data

  # --- 4. Бекенд: FastAPI Gateway & Webhooks ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: downloader_backend
    restart: unless-stopped
    command: python -m uvicorn downloader.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src # Монтування коду для live-reload під час розробки
      - shared_tmp:/tmp/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  # --- 5. Фоновий воркер завантажень (Taskiq / Async worker) ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: downloader_worker
    restart: unless-stopped
    command: python -m taskiq worker downloader.app.core.queue:broker
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - shared_tmp:/tmp/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  # --- 6. Telegram-бот (Окремий процес інтерфейсу) ---
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: downloader_bot
    restart: unless-stopped
    command: python -m downloader.app.connect.telegram.bot
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  shared_tmp: # Спільний том для локальних буферів /tmp/downloads