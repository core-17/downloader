<!-- ==================== МОДАЛЬНЕ ВІКНО ПОСТА YANDE.RE ==================== -->
<div v-if="selectedBooruPost"
     class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4"
     @click.self="selectedBooruPost = null">
    <div class="bg-slate-900 border border-pink-500/40 rounded-2xl max-w-5xl w-full overflow-hidden shadow-2xl">
        <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-3.5 border-b border-slate-800">
            <div>
                <h3 class="text-sm font-bold text-white">
                    Yande.re Post #{{ selectedBooruPost.id }} ({{ selectedBooruPost.width }}×{{ selectedBooruPost.height }})
                </h3>
                <p class="text-xs text-slate-400">
                    Розмір оригіналу: {{ (selectedBooruPost.file_size / (1024 * 1024)).toFixed(2) }} МБ • Рейтинг: ★ {{ selectedBooruPost.score }}
                </p>
            </div>

            <div class="flex items-center gap-2">
                <!-- Окремий тумблер модального вікна (НЕ перемикає загальну стрічку!) -->
                <div class="flex items-center bg-slate-950 border border-slate-800 p-1 rounded-xl text-xs">
                    <span class="text-slate-400 px-1 text-[11px]">У модалці:</span>
                    <button type="button"
                            @click="booruModalViewMode = 'preview'"
                            :class="booruModalViewMode === 'preview' ? 'bg-pink-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'"
                            class="px-2.5 py-1 rounded-lg font-semibold transition">
                        ⚡ Прев'ю
                    </button>
                    <button type="button"
                            @click="booruModalViewMode = 'original'"
                            :class="booruModalViewMode === 'original' ? 'bg-pink-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'"
                            class="px-2.5 py-1 rounded-lg font-semibold transition">
                        🖼️ Оригінал ({{ (selectedBooruPost.file_size / (1024 * 1024)).toFixed(1) }} MB)
                    </button>
                </div>
                <button @click="selectedBooruPost = null"
                        class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm">
                    ✕ Закрити
                </button>
            </div>
        </div>

        <div class="p-4 bg-slate-950 flex items-center justify-center max-h-[70vh] overflow-auto">
            <img :key="selectedBooruPost.id + '_modal_' + booruModalViewMode"
                 :src="getBooruDisplayUrl(selectedBooruPost, true)"
                 @error="handleBooruImgError($event, selectedBooruPost, true)"
                 referrerpolicy="no-referrer"
                 class="max-h-[65vh] w-auto object-contain rounded-lg shadow-lg" />
        </div>

        <div class="p-4 bg-slate-900 border-t border-slate-800 space-y-3">
            <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
                <button v-for="t in (selectedBooruPost.tags || '').split(' ').filter(Boolean)"
                        :key="t"
                        @click="setBooruTag(t); selectedBooruPost = null"
                        class="px-2 py-0.5 rounded bg-slate-950 hover:bg-pink-950 text-slate-300 hover:text-pink-300 border border-slate-800 text-xs transition">
                    #{{ t }}
                </button>
            </div>
            <div class="flex justify-end gap-3">
                <a :href="selectedBooruPost.post_url" target="_blank"
                   class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200">
                    🌐 Відкрити на Yande.re
                </a>
                <button @click="quickDownloadBooru(selectedBooruPost)"
                        class="px-5 py-2 rounded-xl bg-pink-600 hover:bg-pink-500 text-xs font-semibold text-white">
                    {{ booruSavedIds[selectedBooruPost.id] ? '✅ Збережено у сховищі' : '⬇ Скачати оригінал у сховище' }}
                </button>
            </div>
        </div>
    </div>
</div>
