<!-- ==================== МОДАЛЬНЕ ВІКНО ПЕРЕГЛЯДУ ФАЙЛУ СХОВИЩА ==================== -->
<div v-if="modalFile"
     class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
     @click.self="closeModal">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl">
        <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-800">
            <div class="truncate pr-4">
                <h3 class="text-sm font-bold text-white truncate">{{ modalFile.name }}</h3>
                <p class="text-xs text-slate-400">
                    {{ modalFile.size_mb }} МБ • {{ formatDate(modalFile.modified_ts) }}
                    <span v-if="modalFile.source_platform"> • {{ modalFile.source_platform }}</span>
                </p>
            </div>
            <button @click="closeModal"
                    class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm">
                ✕ Закрити
            </button>
        </div>

        <div class="p-4 bg-slate-950 flex items-center justify-center max-h-[75vh] overflow-auto">
            <img v-if="modalFile.media_type === 'image'"
                 :src="modalFile.view_url || ('/api/v1/files/view/' + encodeVaultPath(modalFile.relative_path))"
                 class="max-h-[70vh] w-auto object-contain rounded-lg" />
            <video v-else-if="modalFile.media_type === 'video'"
                   :src="modalFile.view_url || ('/api/v1/files/view/' + encodeVaultPath(modalFile.relative_path))"
                   controls autoplay
                   class="max-h-[70vh] w-full rounded-lg"></video>
            <audio v-else-if="modalFile.media_type === 'audio'"
                   :src="modalFile.view_url || ('/api/v1/files/view/' + encodeVaultPath(modalFile.relative_path))"
                   controls autoplay
                   class="w-full my-8"></audio>
            <iframe v-else-if="modalFile.extension === 'pdf'"
                    :src="modalFile.view_url || ('/api/v1/files/view/' + encodeVaultPath(modalFile.relative_path))"
                    class="w-full h-[70vh] rounded-lg border-0"></iframe>
            <div v-else class="py-12 text-center space-y-3">
                <div class="text-5xl">{{ getMediaIcon(modalFile.media_type) }}</div>
                <div class="text-sm text-slate-300">Попередній перегляд для цього типу файлу недоступний</div>
            </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 px-5 py-3.5 bg-slate-900 border-t border-slate-800">
            <div class="flex flex-wrap gap-1">
                <span v-for="t in (modalFile.tags || [])" :key="t"
                      class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-xs">
                    #{{ t }}
                </span>
            </div>
            <div class="flex items-center gap-3">
                <button type="button"
                        @click="deleteVaultFile(modalFile)"
                        class="px-4 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-600 text-xs font-semibold text-rose-300 hover:text-white border border-rose-500/30 transition">
                    🗑️ Видалити зі сховища
                </button>
                <a :href="modalFile.view_url || ('/api/v1/files/view/' + encodeVaultPath(modalFile.relative_path))"
                   target="_blank"
                   class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition">
                    🔗 Відкрити у новій вкладці
                </a>
                <a :href="modalFile.download_url || ('/api/v1/files/download/' + encodeVaultPath(modalFile.relative_path))"
                   class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white transition">
                    ⬇ Скачати на пристрій
                </a>
            </div>
        </div>
    </div>
</div>
