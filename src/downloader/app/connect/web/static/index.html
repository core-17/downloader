<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Downloader — Панель керування</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-blue-500 selection:text-white">
<div id="app" v-cloak class="w-full px-2 sm:px-4 lg:px-6 pb-6">

    <!-- Закріплена плаваюча шапка + навігаційні вкладки (видно при гортанні вгору або зверху) -->
    <header class="sticky-navbar py-3 border-b border-slate-800 -mx-2 sm:-mx-4 lg:-mx-6 px-2 sm:px-4 lg:px-6 mb-4"
            :class="isNavVisible ? 'navbar-visible' : 'navbar-hidden'">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20 text-lg font-bold">
                    ⬇
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                        <span>Universal Media Downloader</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 hidden sm:block">YouTube • Twitter/X • Pinterest • Reddit • Yande.re Booru • Локальне сховище</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium border"
                     :class="wsConnected ? 'bg-emerald-950/60 border-emerald-700/50 text-emerald-300' : 'bg-rose-950/60 border-rose-700/50 text-rose-300'">
                    <span class="w-2 h-2 rounded-full" :class="wsConnected ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'"></span>
                    <span class="hidden sm:inline">{{ wsConnected ? 'Live WebSocket підключено' : 'Перепідключення...' }}</span>
                    <span class="sm:hidden">{{ wsConnected ? 'Online' : 'Offline' }}</span>
                </div>
                <button @click="refreshAll" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition flex items-center gap-1.5 shadow">
                    <span>🔄</span>
                    <span class="hidden sm:inline">Оновити</span>
                </button>
            </div>
        </div>

        <!-- Навігаційні вкладки всередині закріпленої шапки -->
        <div class="flex flex-wrap gap-2 mt-3 pt-2.5 border-t border-slate-800/80">
            <button @click="currentTab = 'active'"
                    :class="currentTab === 'active' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2">
                <span>⚡ Завантаження</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">{{ activeTasks.length }}</span>
            </button>

            <button @click="currentTab = 'booru'"
                    :class="currentTab === 'booru' ? 'bg-pink-600 text-white shadow-lg shadow-pink-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2">
                <span>🌸 Booru / Yande.re</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">{{ booruPosts.length || 'Live' }}</span>
            </button>

            <button @click="currentTab = 'vault'"
                    :class="currentTab === 'vault' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2">
                <span>📁 Сховище</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">{{ vaultFiles.length }}</span>
            </button>

            <button @click="currentTab = 'history'"
                    :class="currentTab === 'history' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2">
                <span>📋 Історія</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">{{ allTasksList.length }}</span>
            </button>

            <!-- Глобальний тумблер підгонки зображень під контейнер (розтягування по більшій стороні) для всіх вкладок -->
            <div class="ml-auto flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 px-2.5 py-1 rounded-xl text-xs">
                <span class="text-slate-400 hidden md:inline text-[11px] font-medium">🖼️ Фіт прев'ю:</span>
                <button type="button" @click="setGlobalImageFit('contain')"
                        :class="globalImageFit === 'contain' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                        title="Масштабувати по більшій стороні під розмір контейнера без обрізання"
                        class="px-2 py-0.5 rounded-lg transition text-[11px]">
                    Масштабувати (без обрізання)
                </button>
                <button type="button" @click="setGlobalImageFit('cover')"
                        :class="globalImageFit === 'cover' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                        title="Заповнити повністю з обрізанням країв"
                        class="px-2 py-0.5 rounded-lg transition text-[11px]">
                    Заповнити (обрізати)
                </button>
            </div>
        </div>
    </header>


    <!-- Підключення окремих шаблонів кожної вкладки -->
    <!-- #include virtual="tabs/active.html" -->
    <!-- #include virtual="tabs/booru.html" -->
    <!-- #include virtual="tabs/vault.html" -->
    <!-- #include virtual="tabs/history.html" -->

    <!-- Підключення окремих шаблонів модальних вікон -->
    <!-- #include virtual="modals/vault_modal.html" -->
    <!-- #include virtual="modals/booru_modal.html" -->

</div>

<!-- Модульні скрипти інтерфейсу -->
<script src="/static/js/utils.js"></script>
<script src="/static/js/tasks.js"></script>
<script src="/static/js/downloads.js"></script>
<script src="/static/js/booru.js"></script>
<script src="/static/js/vault.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
