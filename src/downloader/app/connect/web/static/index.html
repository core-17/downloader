<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-blue-500 selection:text-white">
<div id="app" v-cloak class="w-full px-2 sm:px-4 lg:px-6 pb-6">

    <!-- Закріплена плаваюча шапка + навігаційні вкладки (видно при гортанні вгору або зверху) -->
    <header class="sticky-navbar py-2 sm:py-3 border-b border-slate-800 -mx-2 sm:-mx-4 lg:-mx-6 px-2 sm:px-4 lg:px-6 mb-3 sm:mb-4"
            :class="isNavVisible ? 'navbar-visible' : 'navbar-hidden'">
        <div class="flex items-center justify-between gap-2 sm:gap-3">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20 text-base sm:text-lg font-bold shrink-0">
                    ⬇
                </div>
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2 truncate">
                        <span>{{ t('app_title') }}</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 hidden sm:block">{{ t('app_subtitle') }}</p>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <!-- Статус WebSocket підключення -->
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border"
                     :class="wsConnected ? 'bg-emerald-950/60 border-emerald-700/50 text-emerald-300' : 'bg-rose-950/60 border-rose-700/50 text-rose-300'">
                    <span class="w-2 h-2 rounded-full" :class="wsConnected ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'"></span>
                    <span class="hidden sm:inline">{{ wsConnected ? t('ws_connected') : t('ws_reconnecting') }}</span>
                    <span class="sm:hidden text-[10px]">{{ wsConnected ? t('status_online') : t('status_offline') }}</span>
                </div>

                <!-- Кнопка акаунтів та API ключів -->
                <button type="button"
                        @click="openAccountModal()"
                        class="flex items-center gap-1.5 px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-700/80 rounded-xl text-xs font-semibold text-slate-200 transition shadow"
                        :title="t('accounts_btn_tip')">
                    <span>{{ (activeAccount && activeAccount().avatar_emoji) || '👤' }}</span>
                    <span class="hidden md:inline">{{ (activeAccount && activeAccount().display_name) || t('account_btn') }}</span>
                    <span class="text-[9px] text-slate-400">⚙️</span>
                </button>

                <!-- Випадне меню вибору мови (Dropdown) -->
                <div class="relative">
                    <button type="button"
                            @click="isLangMenuOpen = !isLangMenuOpen"
                            class="flex items-center gap-1.5 px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-700/80 rounded-xl text-xs font-semibold text-slate-200 transition shadow"
                            :title="currentLangMeta ? currentLangMeta.name : 'Language'">
                        <span>{{ currentLangMeta ? (currentLangMeta.flag + ' ' + currentLangMeta.code.toUpperCase()) : '🌐' }}</span>
                        <span class="text-[9px] text-slate-400">▾</span>
                    </button>
                    <!-- Випадаючий список мов (22 мови з плавним скролом) -->
                    <div v-if="isLangMenuOpen"
                         class="absolute right-0 mt-1.5 w-44 max-h-72 overflow-y-auto overscroll-contain bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 z-50 divide-y divide-slate-800/60 custom-scrollbar">
                        <button v-for="l in supportedLanguages" :key="l.code"
                                type="button"
                                @click="setLanguage(l.code); isLangMenuOpen = false"
                                :class="currentLang === l.code ? 'bg-blue-600/25 text-blue-300 font-bold' : 'text-slate-300 hover:bg-slate-800'"
                                class="w-full px-3 py-1.5 text-left text-xs flex items-center justify-between transition">
                            <span class="flex items-center gap-2 truncate">
                                <span>{{ l.flag }}</span>
                                <span class="truncate">{{ l.name }}</span>
                            </span>
                            <span v-if="currentLang === l.code" class="text-blue-400 font-bold ml-1">✓</span>
                        </button>
                    </div>
                </div>

                <!-- Кнопка оновлення -->
                <button @click="refreshAll" class="px-2.5 sm:px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition flex items-center gap-1 shadow">
                    <span>🔄</span>
                    <span class="hidden sm:inline">{{ t('btn_refresh') }}</span>
                </button>
            </div>
        </div>

        <!-- Навігаційні вкладки всередині закріпленої шапки (горизонтальний скрол на мобільному) -->
        <div class="flex items-center gap-2 mt-2 pt-2 border-t border-slate-800/80 overflow-x-auto no-scrollbar pb-0.5">
            <button @click="currentTab = 'active'"
                    :class="currentTab === 'active' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="shrink-0 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                <span>⚡ {{ t('tab_active') }}</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">{{ activeTasks.length }}</span>
            </button>

            <button @click="currentTab = 'booru'"
                    :class="currentTab === 'booru' ? 'bg-pink-600 text-white shadow-lg shadow-pink-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="shrink-0 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                <span>🌸 {{ t('tab_booru') }}</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">
                    {{ booruTotalCount !== null ? Number(booruTotalCount).toLocaleString() : (booruPosts.length || 'Live') }}
                </span>
            </button>

            <button @click="currentTab = 'vault'"
                    :class="currentTab === 'vault' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="shrink-0 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                <span>📁 {{ t('tab_vault') }}</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">{{ vaultFiles.length }}</span>
            </button>

            <button @click="currentTab = 'history'"
                    :class="currentTab === 'history' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'"
                    class="shrink-0 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                <span>📋 {{ t('tab_history') }}</span>
                <span class="px-1.5 py-0.2 text-[11px] rounded-full bg-black/30">{{ allTasksList.length }}</span>
            </button>

            <!-- Глобальний тумблер підгонки зображень під контейнер для всіх вкладок -->
            <div class="shrink-0 ml-auto flex items-center gap-1 bg-slate-950/80 border border-slate-800 px-2 py-1 rounded-xl text-xs">
                <span class="text-slate-400 hidden sm:inline text-[11px] font-medium">🖼️ {{ t('display_label') }}</span>
                <button type="button" @click="setGlobalImageFit('contain')"
                        :class="globalImageFit === 'contain' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                        :title="t('fit_contain_tip')"
                        class="px-2 py-0.5 rounded-lg transition text-[11px] whitespace-nowrap">
                    {{ t('fit_contain') }}
                </button>
                <button type="button" @click="setGlobalImageFit('cover')"
                        :class="globalImageFit === 'cover' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                        :title="t('fit_cover_tip')"
                        class="px-2 py-0.5 rounded-lg transition text-[11px] whitespace-nowrap">
                    {{ t('fit_cover') }}
                </button>
            </div>
        </div>
    </header>


    <!-- Підключення окремих шаблонів кожної вкладки -->
    <!-- #include virtual="tabs/active.html" -->
    <!-- #include virtual="tabs/booru.html" -->
    <!-- #include virtual="tabs/vault.html" -->
    <!-- #include virtual="tabs/history.html" -->

    <!-- Підключення окремих шаблонів модальних вікон -->
    <!-- #include virtual="modals/vault_modal.html" -->
    <!-- #include virtual="modals/booru_modal.html" -->
    <!-- #include virtual="modals/accounts_modal.html" -->

</div>

<!-- Модульні скрипти інтерфейсу -->
<script src="/static/js/i18n.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/accounts.js"></script>
<script src="/static/js/tasks.js"></script>
<script src="/static/js/downloads.js"></script>
<script src="/static/js/booru.js"></script>
<script src="/static/js/vault.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
